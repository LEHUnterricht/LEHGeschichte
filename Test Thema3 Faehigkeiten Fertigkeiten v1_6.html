<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test: Fähigkeiten und Fertigkeiten (Version 1.6)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
:root{--slate:#42536A;--blue:#5C7A99;--light:#EDF0F3;--gold:#C9A227;--cream:#FBF3DD;--ink:#1F2328;--mute:#5F6368;--line:#D6DBE0;--ok:#2E7D5B;--okbg:#E4F2EB;--bad:#B5533C;--badbg:#F8E6E1;--paper:#F4F6F8}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:18px/1.5 'IBM Plex Sans',Arial,Verdana,sans-serif}
header{background:var(--slate);color:#fff;padding:18px 20px}
header .in{max-width:860px;margin:0 auto;display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
header h1{font-size:22px;margin:0;font-weight:700}
header .sub{font-size:15px;opacity:.85}
main{max-width:860px;margin:0 auto;padding:22px 16px 60px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:22px 24px;margin-bottom:18px}
.info{background:var(--light);border-left:6px solid var(--blue);border-radius:0 10px 10px 0;padding:16px 20px;margin:16px 0}
.merk{background:var(--cream);border-left:6px solid var(--gold);border-radius:0 10px 10px 0;padding:16px 20px;margin:16px 0}
h2{font-size:26px;margin:0 0 10px;color:var(--slate)}
h3{font-size:19px;margin:0 0 6px;color:var(--slate)}
ul{margin:6px 0 6px;padding-left:22px}
li{margin:3px 0}
button{font:600 17px 'IBM Plex Sans',Arial,sans-serif;border:0;border-radius:10px;padding:12px 20px;cursor:pointer;background:var(--slate);color:#fff}
button.sec{background:#fff;color:var(--slate);border:2px solid var(--slate)}
button:disabled{opacity:.4;cursor:default}
button:focus-visible,input:focus-visible+.opt,.dot:focus-visible{outline:3px solid #8FB0D1;outline-offset:2px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.spread{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:18px}
input[type=text]{font:inherit;padding:10px 12px;border:2px solid var(--line);border-radius:8px;width:100%;max-width:380px}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--blue);transition:width .25s}
.meta{display:flex;justify-content:space-between;font-size:15px;color:var(--mute);margin:8px 0 14px}
.tag{display:inline-block;font-size:14px;font-weight:600;border:2px solid var(--blue);color:var(--slate);border-radius:999px;padding:0 10px;margin-right:8px}
.qtext{font-size:21px;font-weight:600;line-height:1.4;margin:6px 0 14px}
.hint{font-size:15px;color:var(--mute);margin:-6px 0 14px}
label.o{display:block;cursor:pointer;margin:10px 0}
label.o input{position:absolute;opacity:0;width:1px;height:1px}
.opt{display:flex;gap:14px;align-items:flex-start;border:2px solid var(--line);border-radius:10px;padding:12px 14px;background:#fff}
.opt .box{flex:none;width:26px;height:26px;border:2px solid var(--blue);border-radius:6px;margin-top:1px;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;font-size:16px}
input:checked+.opt{border-color:var(--slate);background:var(--light)}
input:checked+.opt .box{background:var(--slate);border-color:var(--slate)}
input:checked+.opt .box::after{content:"✓"}
.dots{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 4px}
.dot{width:36px;height:36px;border-radius:8px;padding:0;font-size:15px;background:#fff;color:var(--slate);border:2px solid var(--line)}
.dot.done{background:var(--light);border-color:var(--blue)}
.dot.cur{background:var(--slate);color:#fff;border-color:var(--slate)}
.score{font-size:46px;font-weight:700;color:var(--slate);line-height:1.1}
.rq{border:1px solid var(--line);border-radius:12px;background:#fff;padding:18px 20px;margin-bottom:16px}
.rq.full{border-left:8px solid var(--ok)}
.rq.part{border-left:8px solid var(--gold)}
.rq.none{border-left:8px solid var(--bad)}
.ro{display:flex;gap:10px;align-items:flex-start;border:2px solid var(--line);border-radius:8px;padding:8px 12px;margin:7px 0;background:#fff}
.ro .mk{flex:none;min-width:26px;font-weight:700}
.ro.right{background:var(--okbg);border-color:var(--ok)}
.ro.wrong{background:var(--badbg);border-color:var(--bad)}
.ro .st{font-size:14px;color:var(--mute);display:block}
.expl{background:var(--light);border-left:6px solid var(--blue);padding:10px 14px;margin-top:10px;border-radius:0 8px 8px 0;font-size:16px}
.pts{font-weight:700;color:var(--slate)}
.hide{display:none !important}
.big{background:var(--slate);color:#fff;border-radius:14px;padding:20px 16px 22px;text-align:center;margin-bottom:14px}
.big .who{font-size:18px;opacity:.9}
.big .num{font-size:clamp(88px,24vw,160px);font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums}
.big .num span{font-size:.42em;font-weight:600;opacity:.85}
.big .lbl{font-size:clamp(20px,4.5vw,28px);font-weight:600}
.pts2{font-size:19px;margin:0 0 12px;text-align:center}
.clock{font-weight:700;font-size:20px;font-variant-numeric:tabular-nums;background:rgba(255,255,255,.15);border-radius:8px;padding:2px 12px}
.clock.low{background:#C9A227;color:#1F2328}
.clock.urgent{background:#B5533C;color:#fff}
button.link{background:none;color:var(--slate);text-decoration:underline;padding:6px 4px;font-weight:500;font-size:16px}
.skiptag{display:inline-block;font-size:14px;font-weight:600;background:var(--cream);border:2px solid var(--gold);border-radius:999px;padding:0 10px;margin-right:8px}
.card.good{border:3px solid var(--ok);background:var(--okbg)}
.card.bad{border:3px solid var(--bad);background:var(--badbg)}
.fb{font-size:22px;font-weight:700;margin:14px 0 0;display:flex;align-items:center;gap:10px}
.card.good .fb{color:var(--ok)}.card.bad .fb{color:var(--bad)}
.fb .sym{font-size:30px;line-height:1}
.card.good .opt,.card.bad .opt{background:rgba(255,255,255,.6)}
input:disabled+.opt{cursor:default}
footer{max-width:860px;margin:0 auto;padding:0 16px 30px;color:var(--mute);font-size:14px}
@media print{header,.noprint,.spread,footer{display:none !important}body{background:#fff}.card,.rq{break-inside:avoid}}
</style>
</head>
<body>
<header><div class="in"><h1>Fähigkeiten und Fertigkeiten</h1><span class="sub">Sport P5 · Bewegungslehre · Thema 3 · Test</span><span id="clock" class="clock"></span></div></header>
<main id="main"></main>
<footer>Version 1.6</footer>
<script>
(function(){
var Q=[{"afb": "I", "q": "Welche Aussagen zu koordinativen Fähigkeiten treffen zu?", "o": ["Sie sind relativ stabile Voraussetzungen, die in ganz unterschiedlichen Bewegungen wirksam sind.", "Sie sind unveränderlich und lassen sich durch Training nicht beeinflussen.", "Sie werden nicht auf dieselbe zielgerichtete Weise erlernt wie eine Fertigkeit, sondern eher gefördert bzw. trainiert.", "Sie gelten jeweils nur für genau eine Sportart."]}, {"afb": "I", "q": "Welche Aussagen zur Herkunft des Sieben-Fähigkeiten-Modells sind richtig?", "o": ["Das Modell entstand 1978 im Umfeld der DDR-Sportwissenschaft.", "Blume leitete es aus den Anforderungsprofilen zahlreicher damaliger Spitzensportarten ab.", "Das Modell geht auf Antoinette Gentile (1972) zurück.", "Das Modell von Hirtz (1985) unterscheidet ebenfalls sieben koordinative Fähigkeiten."]}, {"afb": "I", "q": "Welche der folgenden Fähigkeiten gehören zu den sieben koordinativen Fähigkeiten nach Blume?", "o": ["Orientierungsfähigkeit", "Antizipationsfähigkeit", "Umstellungsfähigkeit", "Ausdauerfähigkeit"]}, {"afb": "I", "q": "Welche Formen der Gleichgewichtsfähigkeit werden unterschieden?", "o": ["statische Gleichgewichtsfähigkeit (z. B. eine Standwaage)", "einfache Gleichgewichtsfähigkeit", "dynamische Gleichgewichtsfähigkeit (z. B. die Landung nach einem Abgang am Reck)", "komplexe Gleichgewichtsfähigkeit"]}, {"afb": "I", "q": "Welche Aussagen zur Reaktionsfähigkeit sind richtig?", "o": ["Der Start beim 100-Meter-Lauf auf den Startschuss ist ein Beispiel für eine einfache Reaktion.", "Eine Torhüterin, die erst im letzten Moment erkennt, in welche Ecke geschossen wird, zeigt eine Wahlreaktion.", "Bei der Wahlreaktion gibt es ein einzelnes, bekanntes Signal mit fest eingeübter Bewegungsantwort.", "Eine komplexe motorische Reaktion liegt vor, wenn die Reaktion besonders langsam erfolgt."]}, {"afb": "I", "q": "Worauf bezieht sich die Orientierungsfähigkeit?", "o": ["Auf das Bestimmen und gezielte Verändern der eigenen Position und Bewegung in Raum und Zeit, bezogen auf ein Aktionsfeld und/oder ein bewegtes Objekt.", "Auf das feine Abstimmen des Krafteinsatzes einzelner Bewegungsphasen.", "Auf das schnelle Auslösen einer Handlung auf ein Signal hin.", "Auf das zuverlässige Reproduzieren eines gleichmäßigen Bewegungsrhythmus."]}, {"afb": "I", "q": "Welches Beispiel passt am besten zur Differenzierungsfähigkeit?", "o": ["Der genau dosierte Krafteinsatz beim Elfmeterschuss.", "Das Zusammenspiel von Anlauf, Absprung und Armschwung beim Weitsprung.", "Der Start beim 100-Meter-Lauf auf den Startschuss.", "Der gleichmäßige Hürdenlauf mit festen Hindernisabständen."]}, {"afb": "I", "q": "Welche Aussagen zur Kopplungsfähigkeit sind richtig?", "o": ["Teilkörperbewegungen werden zeitlich, räumlich und dynamisch so abgestimmt, dass eine „Gliederkette“ entsteht.", "Beim Kugelstoßen (O’Brien-Technik) läuft der Impuls vom Fuß über Beinstreckung sowie Hüft- und Rumpfdrehung bis zur Armstreckung.", "Kopplung bedeutet, eine begonnene Bewegung spontan an eine veränderte Situation anzupassen.", "Beim Kugelstoßen genügt reine Armkraft, um die nötige Dynamik zu erzeugen."]}, {"afb": "I", "q": "Welche Aussage zur Umstellungsfähigkeit ist richtig?", "o": ["Sie ist besonders in Rückschlag- und Mannschaftssportarten gefordert und eng mit Antizipation, Orientierung und Reaktion gekoppelt.", "Sie beschreibt das Einhalten eines vorgegebenen Rhythmus.", "Sie beschreibt das Abstimmen von Teilbewegungen auf wenige Millisekunden genau.", "Sie spielt nur bei geschlossenen Fertigkeiten eine Rolle."]}, {"afb": "I", "q": "Für welche Beispiele nennt das Material einen von außen vorgegebenen Rhythmus?", "o": ["Tanzsport, bei dem Musik den Rhythmus vorgibt", "Der Anlauf beim Weitsprung", "Hürdenlauf, bei dem die Hindernisabstände den Rhythmus bestimmen", "Der Anlauf beim Hochsprung"]}, {"afb": "II", "q": "Welche Aussagen zur Abgrenzung der Begriffe sind richtig?", "o": ["Koordinative Fähigkeiten sind Dispositionen bzw. Potenziale.", "Bewegungskoordination ist das sichtbare Ergebnis einer konkreten Bewegung.", "Koordinative Fähigkeiten und Bewegungskoordination bedeuten dasselbe.", "Koordinative Leistungen werden vor allem vom Großhirn gesteuert."]}, {"afb": "I", "q": "Welche Zuordnungen der Praxisaufgaben aus dem Material sind richtig?", "o": ["Reaktionsstab-Versuch: einfache Reaktionszeit", "Einbeinstand mit geschlossenen Augen: Gleichgewichtsfähigkeit", "Reaktionsstab-Versuch: Differenzierungsfähigkeit", "Einbeinstand mit geschlossenen Augen: Rhythmisierungsfähigkeit"]}, {"afb": "I", "q": "Welche Aussagen zur Bewegungsfertigkeit stimmen?", "o": ["Eine Bewegungsfertigkeit ist eine erlernte, zielgerichtete Bewegung.", "Der Greifreflex von Säuglingen ist ein Beispiel für eine Bewegungsfertigkeit.", "Eine Fertigkeit muss erst erworben werden und lässt sich gezielt durch Übung verbessern.", "Das Atmen ist ein typisches Beispiel für eine Bewegungsfertigkeit."]}, {"afb": "I", "q": "Welche Zuordnungen zu den einfachen Klassifikationen sind richtig?", "o": ["Dartwurf: feinmotorische Fertigkeit", "Weitsprung: feinmotorische Fertigkeit", "Turnübung am Boden: serielle Fertigkeit", "Schwimmen: diskrete Fertigkeit"]}, {"afb": "II", "q": "Welche Aussagen zu offenen und geschlossenen Fertigkeiten sind richtig?", "o": ["Eine Kippe am Reck ist ein Beispiel für eine geschlossene Fertigkeit.", "Offene Fertigkeiten müssen laufend an eine wechselnde Umgebung angepasst werden.", "Geschlossen bedeutet, dass nur wenig Muskulatur beteiligt ist.", "Ein Torwurf im Spiel ist eine geschlossene Fertigkeit."]}, {"afb": "II", "q": "Welche Aussagen zum Umgebungskontext im Gentile-Raster sind richtig?", "o": ["Er berücksichtigt, ob die Umgebung ruht oder sich während der Bewegung verändert.", "Er berücksichtigt, ob die Bedingungen von Versuch zu Versuch gleich bleiben oder wechseln (Intertrial-Variabilität).", "Er beschreibt, ob der eigene Körper transportiert werden muss.", "Er beschreibt, ob zusätzlich ein Objekt gehandhabt wird."]}, {"afb": "II", "q": "Welche Einordnung im Gentile-Raster ist richtig?", "o": ["Handstand-Halt: variable Umgebung, mit Objekt, mit Körpertransport", "Standweitsprung: stabile Umgebung, ohne Objekt, mit Körpertransport", "Kugelstoßen: stabile Umgebung, ohne Objekt, ohne Körpertransport", "Tennis (Rückschlagspiel): stabile Umgebung, mit Objekt, mit Körpertransport"]}, {"afb": "II", "q": "Wofür lässt sich das Gentile-Raster praktisch nutzen?", "o": ["Um eine Übungsreihe im Schulsport vom Einfachen zum Komplexen zu steigern.", "Um in der Rehabilitation zunächst unter stabilen Bedingungen ohne Objekt zu trainieren und später variable Umgebung und Objekte hinzuzunehmen.", "Um die genetische Veranlagung für eine Sportart zu bestimmen.", "Um Anfänger direkt mit der komplexesten Variante einer Fertigkeit zu beginnen."]}, {"afb": "I", "q": "Welche Aussage über das Verhältnis von Fähigkeiten und Fertigkeiten ist richtig?", "o": ["Gute Fähigkeiten sind eine notwendige, aber keine hinreichende Bedingung für eine gute Fertigkeit.", "Gute Fähigkeiten sind eine hinreichende, aber keine notwendige Bedingung für eine gute Fertigkeit.", "Gute Fähigkeiten sind sowohl notwendig als auch hinreichend für eine gute Fertigkeit.", "Fähigkeiten und Fertigkeiten haben keinen Zusammenhang."]}, {"afb": "II", "q": "Zwei Sportlerinnen haben ähnlich gute Gleichgewichts- und Kopplungsfähigkeit, beim Handstand ist die eine aber deutlich weiter. Welche Erklärungen passen zum Material?", "o": ["Eine von beiden hat den Handstand deutlich mehr geübt.", "Gleiche Fähigkeiten garantieren nicht eine gleich gute Fertigkeit.", "Ihre Fähigkeiten müssen sich trotz ähnlicher Ausprägung deutlich unterscheiden.", "Eine Fertigkeit wie der Handstand ist angeboren."]}, {"afb": "II", "q": "Was bedeutet „positiver Koordinationstransfer“?", "o": ["Eine breite koordinative Grundlage erleichtert und beschleunigt das Erlernen neuer Fertigkeiten.", "Neu erlernte Fertigkeiten verbessern automatisch alle konditionellen Fähigkeiten.", "Fertigkeiten werden mit der Zeit zu Fähigkeiten.", "Wer nur eine Sportart betreibt, lernt neue Sportarten am schnellsten."]}, {"afb": "II", "q": "Welche Aussagen zu sensiblen Phasen sind richtig?", "o": ["Sensible Phasen sind Altersabschnitte mit besonders hoher Empfänglichkeit für bestimmte Trainingsreize.", "Das „goldene Lernalter“ ist eine umstrittene Modellannahme; die Altersangaben schwanken je nach Autor.", "Nach der Pubertät ist eine Weiterentwicklung koordinativer Fähigkeiten nicht mehr möglich.", "Fertigkeiten lassen sich ausschließlich im goldenen Lernalter erlernen."]}, {"afb": "III", "q": "Welche Aussagen zur Kritik am Sieben-Fähigkeiten-Modell entsprechen dem Material?", "o": ["Roth und Göhner halten die Auswahl der Faktoren für subjektiv.", "Roth und Göhner sehen die Trennschärfe wegen zahlreicher Überschneidungen als nicht ausreichend belegt an.", "Roth und Göhner gehen mithilfe faktorenanalytischer Verfahren von relativ unabhängigen Einzelfähigkeiten aus.", "Faktorenanalytische Verfahren haben das Modell eindeutig widerlegt."]}, {"afb": "III", "q": "Neuere Forschung: Gleichgewichtsleistungen scheinen stark fertigkeitsspezifisch zu sein. Welche Schlüsse passen dazu?", "o": ["Gute Balance auf dem Schwebebalken sagt nicht zuverlässig gute Balance auf dem Einrad voraus.", "Es ist fraglich, ob es überhaupt eine einzige, sportartübergreifende Gleichgewichtsfähigkeit gibt.", "Gleichgewicht spielt im Sport keine Rolle.", "Gleichgewichtsübungen können nie zu Verbesserungen führen."]}];

  '<p>'+N+' Fragen zu koordinativen Fähigkeiten nach Blume, Bewegungsfertigkeiten und dem Gentile-Raster. Du hast <b>'+TIME_MIN+' Minuten</b>. Danach wird der Test automatisch beendet.</p>'+
  '<div class="info"><h3>So funktioniert der Test</h3><ul>'+
  '<li>Pro Frage ist <b>mindestens eine, höchstens zwei</b> Antwort richtig. Kreuze alle zutreffenden Antworten an.</li>'+
  '<li>Mit <b>„Weiter“</b> wird deine Antwort festgehalten. Sie leuchtet kurz <b style="color:#2E7D5B">grün</b> auf, wenn sie vollständig richtig ist, und <b style="color:#B5533C">rot</b>, wenn eine falsche Antwort dabei ist oder eine richtige fehlt. Danach ist die Antwort gesperrt.</li>'+
  '<li>Mit <b>„Überspringen“</b> gibst du eine Frage weiter: Es wird nichts festgehalten, und du siehst keine Rückmeldung. Übersprungene Fragen kommen am Ende noch einmal, solange die Zeit reicht.</li>'+
  '<li><b>Nur festgehaltene Antworten zählen.</b> Angekreuzte, aber nicht mit „Weiter“ bestätigte Antworten werden bei Zeitablauf nicht gewertet. Du musst nicht alle Fragen schaffen.</li>'+
  '<li>Nach dem Test erscheint dein Ergebnis. Danach kannst du dir die richtigen Antworten und Erklärungen ansehen.</li></ul></div>'+
  '<div class="merk"><h3>Bewertung</h3><p style="margin:0">Jede Frage zählt höchstens 1 Punkt. Für jede richtig angekreuzte Antwort gibt es einen Anteil, für jede falsch angekreuzte Antwort wird ein Anteil abgezogen (nie weniger als 0 Punkte pro Frage). Beispiel bei zwei richtigen Antworten: eine richtig = 0,5 Punkte (die Rückmeldung ist dann rot), beide richtig = 1 Punkt (grün), beide richtig plus eine falsche = 0,5 Punkte (rot). Nicht bearbeitete Fragen zählen 0 Punkte.</p></div>'+
  '<p><label for="nm"><b>Name (optional, erscheint nur auf deinem Ergebnis):</b></label><br><input type="text" id="nm" autocomplete="off" value="'+h(st.name)+'"></p>'+
  '<div class="spread" style="justify-content:flex-start"><button id="go">Test starten (Zeit läuft ab dem Klick)</button></div></div>';
  document.getElementById('go').onclick=function(){
    st.name=document.getElementById('nm').value.trim();
    KEY=decodeKey();
    st.order=Q.map(function(q){return shuffle(q.o.map(function(_,i){return i;}));});
    st.sel=Q.map(function(){return [];}); st.done=Q.map(function(){return false;}); st.skipped=Q.map(function(){return false;});
    st.pending=Q.map(function(_,i){return i;}); st.pos=0; st.finished=false; st.timedOut=false;
    st.t0=Date.now(); st.endAt=st.t0+TIME_MIN*60000;
    tick(); st.timer=setInterval(tick,250);
    quiz();
  };
}

function quiz(){
  st.view='quiz'; st.busy=false; var i=st.pending[st.pos], q=Q[i], doneCnt=st.done.filter(Boolean).length;
  var opts=st.order[i].map(function(oi){
    var on=st.sel[i].indexOf(oi)>=0;
    return '<label class="o"><input type="checkbox" value="'+oi+'"'+(on?' checked':'')+'><span class="opt"><span class="box"></span><span>'+h(q.o[oi])+'</span></span></label>';
  }).join('');
  main.innerHTML='<div class="card" id="qc"><div class="bar"><i style="width:'+Math.round(doneCnt/N*100)+'%"></i></div>'+
  '<div class="meta"><span>Frage '+(i+1)+' von '+N+'</span><span>Festgehalten: '+doneCnt+' · offen: '+st.pending.length+'</span></div>'+
  '<p style="margin:12px 0 0">'+(st.skipped[i]?'<span class="skiptag">übersprungen, noch offen</span>':'')+'<span class="tag">Anforderungsbereich '+q.afb+'</span></p>'+
  '<p class="qtext">'+h(q.q)+'</p><p class="hint">Eine oder zwei Antworten sind richtig. Kreuze alle zutreffenden an.</p>'+opts+
  '<div id="fb" class="fb hide" role="status" aria-live="polite"></div>'+
  '<div class="spread"><button class="sec" id="skip"'+(st.pending.length<2?' disabled':'')+'>Überspringen</button>'+
  '<button id="next"'+(st.sel[i].length?'':' disabled')+'>Weiter →</button></div>'+
  '<div style="margin-top:14px"><button class="link" id="end">Test jetzt beenden</button></div></div>';
  var nx=document.getElementById('next'), sk=document.getElementById('skip');
  [].forEach.call(main.querySelectorAll('input[type=checkbox]'),function(cb){
    cb.onchange=function(){var v=+cb.value,a=st.sel[i],p=a.indexOf(v);if(cb.checked&&p<0)a.push(v);if(!cb.checked&&p>=0)a.splice(p,1);nx.disabled=(a.length===0);};
  });
  sk.onclick=function(){
    if(st.busy||st.pending.length<2)return;
    st.skipped[i]=true; st.sel[i]=[]; st.pos=(st.pos+1)%st.pending.length; quiz(); window.scrollTo(0,0);
  };
  document.getElementById('end').onclick=function(){
    if(st.busy)return;
    if(window.confirm('Test jetzt beenden? Nicht festgehaltene Fragen zählen 0 Punkte.'))finish(false);
  };
  nx.onclick=function(){
    if(st.busy||!st.sel[i].length)return; st.busy=true; nx.disabled=true; sk.disabled=true;
    [].forEach.call(main.querySelectorAll('input[type=checkbox]'),function(cb){cb.disabled=true;});
    st.done[i]=true;
    var c=KEY[i].c, s=st.sel[i];
    var ok=(s.length===c.length)&&s.every(function(v){return c.indexOf(v)>=0;});
    var card=document.getElementById('qc'), fb=document.getElementById('fb');
    card.classList.add(ok?'good':'bad');
    fb.innerHTML=ok?'<span class="sym">✓</span><span>Richtig</span>':'<span class="sym">✗</span><span>Nicht vollständig richtig</span>';
    fb.classList.remove('hide');
    setTimeout(function(){
      if(st.finished)return;
      st.pending.splice(st.pos,1);
      if(!st.pending.length){finish(false);return;}
      if(st.pos>=st.pending.length)st.pos=0;
      quiz(); window.scrollTo(0,0);
    }, FB_MS);
  };
}

function finish(timedOut){
  if(st.finished)return; st.finished=true; st.timedOut=timedOut;
  if(st.timer){clearInterval(st.timer);st.timer=null;}
  st.used=Math.min(Date.now()-st.t0,TIME_MIN*60000);
  setClock(timedOut?'⏱ Zeit abgelaufen':'⏱ Beendet','');
  submit(); window.scrollTo(0,0);
}

function submit(){
  var pts=[],tot=0;
  for(var i=0;i<N;i++){
    var c=KEY[i].c,s=st.done[i]?st.sel[i]:[],r=0,f=0;
    s.forEach(function(v){if(c.indexOf(v)>=0)r++;else f++;});
    var p=Math.max(0,(r-f)/c.length); pts.push(p); tot+=p;
  }
  st.res={pts:pts,tot:tot,date:new Date().toLocaleDateString('de-DE'),time:new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})};
  result();
}

function result(){
  st.view='result'; var r=st.res, pc=Math.round(r.tot/N*1000)/10;
  var full=r.pts.filter(function(p){return p>=0.999;}).length, part=r.pts.filter(function(p){return p>0&&p<0.999;}).length, zero=N-full-part;
  main.innerHTML='<div class="card"><div class="big"><div class="who">'+(st.name?h(st.name)+' · ':'')+r.date+', '+r.time+' Uhr</div>'+
  '<div class="num">'+full+'<span> / '+N+'</span></div><div class="lbl">Fragen vollständig richtig</div></div>'+
  '<p class="pts2">Punkte mit Teilpunkten: <b>'+fmt(r.tot)+' von '+N+'</b> ('+fmt(pc)+' %)</p>'+
  '<div class="bar"><i style="width:'+pc+'%"></i></div>'+
  '<p style="margin-top:14px">Voll richtig: <b>'+full+'</b> · Teilweise richtig: <b>'+part+'</b> · Nicht gepunktet: <b>'+zero+'</b></p>'+
  '<p style="margin:4px 0 0">Festgehalten: <b>'+st.done.filter(Boolean).length+'</b> von '+N+' Fragen · Nicht bearbeitet: <b>'+st.done.filter(function(d){return !d;}).length+'</b> · Bearbeitungszeit: <b>'+mmss(st.used)+'</b> von '+TIME_MIN+':00 Minuten</p>'+
  (st.timedOut?'<div class="merk"><b>Die Zeit ist abgelaufen.</b> Der Test wurde automatisch beendet. Nur festgehaltene Antworten wurden gewertet.</div>':'')+
  '<div class="info">Möchtest du sehen, welche Antworten richtig waren, und die Begründungen lesen? Dann öffne die Auswertung.</div>'+
  '<div class="row"><button id="rev">Richtige Antworten und Erklärungen ansehen</button><button class="sec noprint" id="cp">Ergebnis kopieren</button></div><p id="cpm" class="hint" style="margin-top:10px"></p></div>';
  document.getElementById('rev').onclick=function(){review(false);window.scrollTo(0,0);};
  document.getElementById('cp').onclick=function(){
    var t='Test Fähigkeiten und Fertigkeiten (v1.6)'+(st.name?' – '+st.name:'')+' – '+r.date+' '+r.time+' Uhr: '+full+' von '+N+' Fragen richtig, '+fmt(r.tot)+' Punkte ('+fmt(pc)+' %), festgehalten: '+st.done.filter(Boolean).length+' von '+N+(st.timedOut?', Zeit abgelaufen':'');
    var m=document.getElementById('cpm');
    function ok(){m.textContent='Kopiert: '+t;}
    function fb(){var ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');ok();}catch(e){m.textContent=t;}document.body.removeChild(ta);}
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(ok,fb);}else{fb();}
  };
}

function review(onlyWrong){
  st.view='review'; var r=st.res, html='';
  html+='<div class="card noprint"><h2>Auswertung</h2><p>Grün: richtige Antworten. Rot: von dir angekreuzt, aber falsch. Der Randbalken zeigt: grün = voll richtig, gelb = teilweise, rot = nicht gepunktet.</p>'+
  '<div class="row"><button class="sec" id="rb">← Zum Ergebnis</button><button class="sec" id="fl">'+(onlyWrong?'Alle Fragen anzeigen':'Nur nicht voll richtige Fragen anzeigen')+'</button><button class="sec" id="pr">Drucken / als PDF speichern</button></div></div>';
  for(var i=0;i<N;i++){
    var p=r.pts[i]; if(onlyWrong&&p>=0.999)continue;
    var c=KEY[i].c, dn=st.done[i], s=dn?st.sel[i]:[];
    var opts=st.order[i].map(function(oi){
      var right=c.indexOf(oi)>=0, chosen=s.indexOf(oi)>=0, cls='ro', mk='', sub='';
      if(right){cls+=' right';mk='✓';sub=chosen?'richtig, von dir angekreuzt':(dn?'richtig, von dir nicht angekreuzt':'richtig');}
      else if(chosen){cls+=' wrong';mk='✗';sub='falsch, von dir angekreuzt';}
      return '<div class="'+cls+'"><span class="mk">'+mk+'</span><span>'+h(Q[i].o[oi])+(sub?'<span class="st">'+sub+'</span>':'')+'</span></div>';
    }).join('');
    html+='<div class="rq '+(p>=0.999?'full':(p>0?'part':'none'))+'"><p style="margin:0 0 4px"><span class="tag">Frage '+(i+1)+'</span><span class="tag">AFB '+Q[i].afb+'</span><span class="pts">'+fmt(p)+' von 1 Punkt'+(dn?'':' (nicht bearbeitet)')+'</span></p>'+
    '<p class="qtext" style="margin-top:8px">'+h(Q[i].q)+'</p>'+opts+'<div class="expl"><b>Erklärung:</b> '+h(KEY[i].e)+'</div></div>';
  }
  if(onlyWrong&&html.indexOf('class="rq')<0)html+='<div class="card">Alle Fragen waren voll richtig.</div>';
  main.innerHTML=html;
  document.getElementById('rb').onclick=function(){result();window.scrollTo(0,0);};
  document.getElementById('fl').onclick=function(){review(!onlyWrong);window.scrollTo(0,0);};
  document.getElementById('pr').onclick=function(){window.print();};
}

window.addEventListener('beforeunload',function(e){if(st.view==='quiz'&&!st.finished){e.preventDefault();e.returnValue='';}});
start();
})();
</script>
</body>
</html>
